name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements.txt pytest pip-audit
      - name: Install isolated scanner
        run: |
          python -m venv .scanner-venv
          .scanner-venv/bin/python -m pip install -r backend/scanner-requirements.txt
      - name: Audit API dependencies
        run: pip-audit -r backend/requirements.txt --no-deps --disable-pip
      - name: Audit scanner dependencies
        # Semgrep 1.182.1 pins these two versions; see SECURITY.md.
        run: pip-audit -r backend/scanner-requirements.txt --no-deps --disable-pip --ignore-vuln CVE-2026-59951 --ignore-vuln CVE-2026-114603
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Test backend and scanner
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SEMGREP_PATH: .scanner-venv/bin/semgrep
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check dependencies
        run: npm audit --audit-level=high
      - name: Test frontend
        run: npm test
      - name: Type-check and build frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build backend frontend
